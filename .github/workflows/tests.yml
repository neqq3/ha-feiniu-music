name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: HA ${{ matrix.ha }} / Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - ha: '2025.12.2'
            python: '3.13'
            requirements: requirements-test-min.txt
          - ha: '2026.9.4'
            python: '3.14'
            requirements: requirements-test.txt
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: ${{ matrix.requirements }}
      - name: Install test dependencies
        id: dependencies
        run: |
          python -m pip install -r ${{ matrix.requirements }}
          python scripts/install_test_dependencies.py
      - name: Verify HA version
        env:
          EXPECTED_HA: ${{ matrix.ha }}
        run: |
          python -c "import os; from homeassistant.const import __version__; assert __version__ == os.environ['EXPECTED_HA'], __version__; print('Home Assistant', __version__)"
      - name: Lint and check formatting
        run: |
          ruff check custom_components tests scripts
          ruff format --check custom_components tests scripts
      - name: Type check
        run: mypy --python-version ${{ matrix.python }} custom_components/feiniu_music
      - name: Test integration
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: python -m pytest tests --timeout=30
      - name: Synthetic browse measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browse-ha-${{ matrix.ha }}
          path: artifacts/browse-*.json
          if-no-files-found: ignore

  frontend:
    name: Card build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: npm install --no-package-lock
      - run: npm test
      - name: Verify bundled card matches source
        run: |
          npm run build
          git diff --exit-code -- custom_components/feiniu_music/www/feiniu-music-card.js
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:browser
      - name: WebKit browse lifecycle (touch emulation)
        run: npm run test:browser
        env:
          CARD_BROWSER_ENGINE: webkit
