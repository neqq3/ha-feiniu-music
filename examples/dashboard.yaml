# The integration registers the card automatically. Refresh HA after setup.
# For YAML-managed resources, see README.md before using this dashboard.
# Replace these entity IDs with the fixed FeiNiu entities created from selected outputs.
title: FeiNiu Music
views:
  - title: Music
    path: music
    cards:
      - type: custom:feiniu-music-card
        entity: media_player.feiniu_test
        display_mode: compact
        compact_view: auto
        compact_background: artwork
        compact_mask: soft
        theme: dark
      - type: custom:feiniu-music-card
        entity: media_player.feiniu_test_2
        display_mode: compact
        compact_view: simple
        compact_background: default
        theme: dark
  - title: Music library
    path: library
    type: panel
    cards:
      - type: custom:feiniu-music-card
        entity: media_player.feiniu_test
        display_mode: full
